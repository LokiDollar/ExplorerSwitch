name: Windows build and checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        run: msbuild ExplorerSwitch.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /verbosity:minimal
      - name: Check registry behavior
        run: .\bin\x64\${{ matrix.configuration }}\RegistryTests.exe
      - name: Check command parsing
        shell: pwsh
        run: |
          $exe = '.\bin\x64\${{ matrix.configuration }}\ExplorerSwitch.exe'
          & $exe help
          if ($LASTEXITCODE -ne 0) { throw 'Help failed.' }
          & $exe extensions invalid
          if ($LASTEXITCODE -ne 2) { throw 'Invalid arguments must return 2.' }
          '0' | & $exe
          if ($LASTEXITCODE -ne 0) { throw 'Menu exit failed.' }
      - name: Save Release executable
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: ExplorerSwitch-x64
          path: bin/x64/Release/ExplorerSwitch.exe
